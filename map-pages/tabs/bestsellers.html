<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线上宜家 · 美国亚马逊爆款</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 100%; min-height: 100%; }

  body {
    font-family: "Inter", "Roboto", -apple-system, "SF Pro Display", "Segoe UI",
      "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background:
      radial-gradient(52vw 42vh at 14% 18%, rgba(210, 234, 229, 0.55) 0%, rgba(210, 234, 229, 0) 62%),
      radial-gradient(46vw 40vh at 50% 88%, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 68%),
      radial-gradient(50vw 44vh at 86% 22%, rgba(247, 229, 217, 0.55) 0%, rgba(247, 229, 217, 0) 64%),
      linear-gradient(90deg, #EAF3F1 0%, #F5F6F6 50%, #FAEFE9 100%);
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .hero {
    width: 100%;
    max-width: 1200px;
    padding: 48px 32px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 56px;
    align-items: center;
  }

  .eyebrow {
    display: block;
    margin-bottom: 18px;
    font-size: clamp(12px, 1vw, 15px);
    font-weight: 600;
    letter-spacing: 2px;
    color: #1A3A5C;
  }

  .heading {
    font-size: clamp(32px, 4.5vw, 64px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: 1px;
    color: #1A3A5C;
  }

  .desc {
    font-family: "Inter", "Roboto", -apple-system, "SF Pro Display", "Segoe UI",
      "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-size: clamp(14px, 1.15vw, 18px);
    font-weight: 400;
    line-height: 1.8;
    color: #64748b;
    margin: 20px 0 26px;
    max-width: 32em;
  }

  /* 渐变色蓝色填充按钮 */
  .cta {
    background: linear-gradient(135deg, #42A5F5 0%, #1976D2 55%, #0D47A1 100%);
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 12px 26px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(21, 101, 192, 0.28);
    transition: filter .2s ease, transform .12s ease, box-shadow .2s ease;
  }
  .cta:hover { filter: brightness(1.06); box-shadow: 0 8px 20px rgba(21, 101, 192, 0.36); }
  .cta:active { transform: scale(0.95); }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 5 / 4;
  }

  .tile {
    position: absolute;
    top: 0;
    left: 0;
    border-radius: 8px;
    background-color: #ffffff;
    background-repeat: no-repeat;
    background-position: center center;
    background-size: contain;
    border: 1px solid #e6eaef;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    will-change: transform;
  }

  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
  }

  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; gap: 34px; padding: 32px 20px; }
  }
</style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <section class="hero">
    <div class="copy">
      <span class="eyebrow">线上宜家</span>
      <h1 class="heading">美国亚马逊爆款</h1>
      <p class="desc">
        Behind every bestseller lies our team’s relentless dedication and the
        genuine trust of American households. Engineered with passion, proven by love.
      </p>
      <button class="cta" id="cta" type="button">👍点个赞</button>
    </div>

    <div class="stage" id="stage"></div>
  </section>

  <script>
    const IMAGES = [
      "https://m.media-amazon.com/images/I/71mpDCA0YzL.jpg",
      "https://m.media-amazon.com/images/I/71s1bg9wLZL.jpg",
      "https://m.media-amazon.com/images/I/81ChOz+4t6L.jpg",
      "https://m.media-amazon.com/images/I/81Q3IjQMmgL.jpg",
      "https://m.media-amazon.com/images/I/812ivAwegiL.jpg",
      "https://m.media-amazon.com/images/I/71TZJguILyL.jpg",
      "https://m.media-amazon.com/images/I/81VCbfzcXgL.jpg",
      "https://m.media-amazon.com/images/I/81VVXFUVomL.jpg",
      "https://m.media-amazon.com/images/I/61tztqSGvOL.jpg",
      "https://m.media-amazon.com/images/I/81ictKG7nGL.jpg",
      "https://m.media-amazon.com/images/I/71zuqWTc7jL.jpg",
      "https://m.media-amazon.com/images/I/61Iq4HS7VwL.jpg",
      "https://m.media-amazon.com/images/I/71bYDrKKVtL.jpg",
      "https://m.media-amazon.com/images/I/81I3E30ZpOL.jpg",
      "https://m.media-amazon.com/images/I/71U3AEHIXHL.jpg",
      "https://m.media-amazon.com/images/I/81wZzX5J-AL.jpg",
      "https://m.media-amazon.com/images/I/81BFBY1Hk+L.jpg",
      "https://m.media-amazon.com/images/I/71Mw+RlY3ZL.jpg",
      "https://m.media-amazon.com/images/I/81Yy2h1b0+L.jpg",
      "https://m.media-amazon.com/images/I/71jyHf6hmbL.jpg",
      "https://m.media-amazon.com/images/I/81lwboRnDrL.jpg"
    ];

    const COLS = 5;
    const ROWS = 4;
    const GAP = 10;
    const SHUFFLE_MS = 3000;

    const stage = document.getElementById("stage");

    const tiles = IMAGES.map(function (src) {
      const d = document.createElement("div");
      d.className = "tile";
      d.style.backgroundImage = 'url("' + src + '")';
      stage.appendChild(d);
      return d;
    });

    let slots = [];
    let order = tiles.map(function (_, i) { return i; });
    let timer = null;
    let running = true;

    function computeLayout() {
      const W = stage.clientWidth;
      const H = stage.clientHeight;
      if (!W || !H) return;
      const cw = (W - (COLS - 1) * GAP) / COLS;
      const ch = (H - (ROWS - 1) * GAP) / ROWS;
      slots = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          slots.push({ x: c * (cw + GAP), y: r * (ch + GAP) });
        }
      }
      tiles.forEach(function (t) {
        t.style.width = cw + "px";
        t.style.height = ch + "px";
      });
    }

    function place(animate) {
      tiles.forEach(function (t, i) {
        const s = slots[order[i]];
        if (!s) return;
        t.style.transition = animate
          ? "transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1)"
          : "none";
        t.style.transform = "translate(" + s.x + "px, " + s.y + "px)";
      });
    }

    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function doShuffle() {
      const before = order.slice();
      do { shuffle(order); }
      while (order.length > 1 && order.every(function (v, i) { return v === before[i]; }));
      place(true);
    }

    function startTimer() {
      if (timer) clearInterval(timer);
      timer = setInterval(doShuffle, SHUFFLE_MS);
    }

    function stopTimer() {
      if (timer) { clearInterval(timer); timer = null; }
    }

    function boot() {
      computeLayout();
      place(false);
      running = true;
      startTimer();
    }

    window.addEventListener("resize", function () {
      computeLayout();
      place(false);
    });

    // 默认滚动；点击一下 -> 停止；再点击一下 -> 恢复
    document.addEventListener("click", function () {
      if (running) {
        running = false;
        stopTimer();
      } else {
        running = true;
        startTimer();
      }
    });

    if (document.readyState === "complete") {
      requestAnimationFrame(boot);
    } else {
      window.addEventListener("load", function () { requestAnimationFrame(boot); });
    }

    /* ---------------- 礼花 ---------------- */
    const canvas = document.getElementById("confetti");
    const cctx = canvas.getContext("2d");
    const COLORS = ["#1565C0", "#42A5F5", "#FFC107", "#FF7043", "#66BB6A", "#AB47BC", "#EF5350", "#26C6DA"];
    let particles = [];
    let rafId = null;
    let endTime = 0;

    function sizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    sizeCanvas();
    window.addEventListener("resize", sizeCanvas);

    function burst(ox, oy, count, spread) {
      for (let i = 0; i < count; i++) {
        const angle = spread === "up"
          ? (-Math.PI / 2) + (Math.random() - 0.5) * Math.PI * 0.9
          : Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 9;
        particles.push({
          x: ox, y: oy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 6 + Math.random() * 8,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.35,
          life: 1
        });
      }
    }

    function frame(t) {
      cctx.clearRect(0, 0, canvas.width, canvas.height);

      if (t < endTime) {
        if (Math.random() < 0.85) {
          burst(Math.random() * canvas.width, -12, 4, "up");
        }
      }

      particles.forEach(function (p) {
        p.vy += 0.18;
        p.vx *= 0.995;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        cctx.save();
        cctx.translate(p.x, p.y);
        cctx.rotate(p.rot);
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.62);
        cctx.restore();
      });

      particles = particles.filter(function (p) {
        return p.y < canvas.height + 60 && p.x > -80 && p.x < canvas.width + 80;
      });

      if (t < endTime || particles.length) {
        rafId = requestAnimationFrame(frame);
      } else {
        rafId = null;
        cctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    document.getElementById("cta").addEventListener("click", function (e) {
      e.stopPropagation();
      const r = this.getBoundingClientRect();
      endTime = performance.now() + 3000;
      burst(r.left + r.width / 2, r.top + r.height / 2, 130);
      if (!rafId) rafId = requestAnimationFrame(frame);
    });
  </script>
</body>
</html>
